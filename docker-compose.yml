services:
  nginx-gateway:
    image: nginx:alpine
    ports:
      - "8000:8000"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - user-service
  auth-db:
    image: postgres:18
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${AUTH_DB_USER}
      - POSTGRES_PASSWORD=${AUTH_DB_PASSWORD}
      - POSTGRES_DB=${AUTH_DB_NAME}
    env_file:
      - auth_service/.env
    volumes:
      - auth_postgres_data:/var/lib/postgresql
  auth-service:
    build:
      context: .
      dockerfile: auth_service/Dockerfile
    depends_on:
      - auth-db
    env_file:
      - auth_service/.env
  inventory-service:
    build:
      context: .
      dockerfile: inventory_service/Dockerfile
#  kafka-broker:
